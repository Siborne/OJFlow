name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run type-check

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format:check

      - name: Official site check
        run: bun run site:check

      - name: Unit and component tests
        run: bun run test:unit

      - name: Production build
        run: bun run build

  electron-e2e:
    name: Real Electron E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Electron runtime
        run: node node_modules/electron/install.js

      - name: Install Electron runtime libraries
        run: |
          sudo npx playwright install-deps chromium
          sudo apt-get install -y xvfb openbox

      - name: Verify Electron runtime
        run: xvfb-run -a node_modules/electron/dist/electron --no-sandbox --version

      - name: Run Electron E2E
        run: xvfb-run -a sh -c 'openbox >/tmp/openbox.log 2>&1 & bun run test:e2e'
