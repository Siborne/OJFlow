name: Desktop Build & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Electron runtime
        run: node node_modules/electron/install.js

      - name: Type check
        run: bun run type-check

      - name: Lint
        run: bun run lint

      - name: Build Electron main process
        run: bun run build:electron

      - name: Build renderer
        run: bun run build

      - name: Package
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            if [ -n "${{ secrets.CSC_LINK }}" ] && [ -n "${{ secrets.CSC_KEY_PASSWORD }}" ]; then
              export CSC_LINK="${{ secrets.CSC_LINK }}"
              export CSC_KEY_PASSWORD="${{ secrets.CSC_KEY_PASSWORD }}"
              npx electron-builder -p never
            else
              npx electron-builder -p never -c.mac.identity=null
            fi
          elif [ "$RUNNER_OS" = "Windows" ]; then
            if [ -n "${{ secrets.WIN_CSC_LINK }}" ] && [ -n "${{ secrets.WIN_CSC_KEY_PASSWORD }}" ]; then
              export WIN_CSC_LINK="${{ secrets.WIN_CSC_LINK }}"
              export WIN_CSC_KEY_PASSWORD="${{ secrets.WIN_CSC_KEY_PASSWORD }}"
            fi
            npx electron-builder -p never
          else
            npx electron-builder -p never
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ojflow-${{ matrix.os }}
          retention-days: 14
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/*.zip
            release/*.msi
            release/*.snap
          if-no-files-found: warn

      - name: Publish GitHub release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/*.zip
            release/*.msi
            release/*.snap
          draft: true
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
